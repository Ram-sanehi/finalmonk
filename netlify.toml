[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/detect-city"
  to = "/.netlify/functions/detect-city"
  status = 200

[build.processing]
  skip_processing = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
